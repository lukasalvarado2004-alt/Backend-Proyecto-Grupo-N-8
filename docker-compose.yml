
services:
  api-usuario:
    build:
      context: ./api-usuario
      dockerfile: Dockerfile

    container_name: api-usuario

    ports:
      - "8081:8081"

    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ./wallet:/wallet:ro

    restart: unless-stopped
